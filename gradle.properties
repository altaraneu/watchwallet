org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
# iOS targets are declared in every multiplatform module but can only be built on macOS.
# On other hosts they are skipped; CI builds them on a macOS runner.
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.nonTransitiveRClass=true
