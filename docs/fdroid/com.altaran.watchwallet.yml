# DRAFT for fdroiddata (metadata/com.altaran.watchwallet.yml). Not submitted, and not read by anything
# in this repository. Before submitting: replace every CHANGEME, run `fdroid readmeta`, `fdroid lint`,
# `fdroid rewritemeta` and a test build in fdroiddata. See docs/fdroid/README.md.
AntiFeatures:
  NonFreeNet:
    en-US: Fiat values come from the proprietary CoinGecko, Binance and Kraken APIs. Balances use public blockchain servers.
Categories:
  - Money
License: GPL-3.0-only
SourceCode: https://github.com/altaraneu/watchwallet
IssueTracker: https://github.com/altaraneu/watchwallet/issues
Changelog: https://github.com/altaraneu/watchwallet/blob/HEAD/CHANGELOG.md

RepoType: git
Repo: https://github.com/altaraneu/watchwallet.git

Builds:
  - versionName: CHANGEME
    versionCode: 0 # CHANGEME
    commit: CHANGEME # full hash of the signed tag's commit
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-java-alternatives -a java-1.21.0-openjdk-amd64
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: app/build.gradle.kts|versionCode\s*=\s*(\d+)|.|versionName\s*=\s*"([^"]+)"
CurrentVersion: CHANGEME
CurrentVersionCode: 0 # CHANGEME
