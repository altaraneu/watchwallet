# Overrides on top of detekt's default configuration (buildUponDefaultConfig = true).
# Key names follow detekt 2.x.

complexity:
  LongParameterList:
    # Composables take state and many event callbacks by design.
    allowedFunctionParameters: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    # Parsers and response mappers branch a lot by nature.
    allowedComplexity: 20
    ignoreSimpleWhenEntries: true
  NestedBlockDepth:
    allowedDepth: 5
  ComplexCondition:
    allowedConditions: 5
  TooManyFunctions:
    ignorePrivate: true
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 15
    allowedFunctionsPerObject: 15

naming:
  MatchingDeclarationName:
    # Feature files hold a @Serializable route object next to the screen or nav functions.
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  MaxLineLength:
    maxLineLength: 160
  ReturnCount:
    max: 5
    excludeGuardClauses: true
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3
  ThrowsCount:
    max: 4
  WildcardImport:
    # ktlint enforces imports; generated Res accessors are imported with a wildcard.
    active: false
  MagicNumber:
    # Colors, dp values and test fixtures are clearer inline.
    ignoreAnnotated: ['Composable', 'Preview']
    # Encodings, checksums and wire formats are full of protocol constants.
    excludes: ['**/*Test/**', '**/theme/**', '**/*.kts', '**/chain/**', '**/core/crypto/**', '**/core/security/**', '**/core/importexport/**', '**/core/chart/**']
    ignoreEnums: true
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    # TODO markers must reference an issue or milestone: "TODO(M3): ...".
    comments:
      - value: 'FIXME:'
        reason: 'Fix it before merging.'
      - value: 'STOPSHIP:'
        reason: 'Address it before shipping.'
      - value: 'TODO:'
        reason: 'Use TODO(<milestone or issue>): with a reference.'
