name: F-Droid metadata check

# Runs F-Droid's own tools on the draft recipe in a copy of fdroiddata. Windows cannot install
# them, see docs/fdroid/README.md. The real test build happens in fdroiddata's CI.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: app-source
      - name: Install the tools
        run: pipx install git+https://gitlab.com/fdroid/fdroidserver.git
      - name: Prepare the layout
        run: |
          git clone --depth 1 https://gitlab.com/fdroid/fdroiddata.git data
          cp app-source/docs/fdroid/com.altaran.watchwallet.yml data/metadata/
      - name: Lint
        working-directory: data
        run: fdroid lint com.altaran.watchwallet
      - name: Show what rewritemeta would change
        working-directory: data
        run: fdroid rewritemeta com.altaran.watchwallet && (diff -u ../app-source/docs/fdroid/com.altaran.watchwallet.yml metadata/com.altaran.watchwallet.yml || true)
      - name: Run the scanner on the recipe's commit
        working-directory: data
        run: fdroid scanner --exit-code com.altaran.watchwallet
