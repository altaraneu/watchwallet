name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android build, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check strings
        run: python3 scripts/check_strings.py
      - name: Check store metadata
        run: python3 scripts/check_fastlane.py
      - name: Check that bundled logos match their lock file
        run: python3 scripts/fetch_logos.py --check
      - name: Test the server list signing tool
        run: python3 scripts/test_sign_endpoints.py
      - name: Build, test and lint
        run: ./gradlew :app:assembleDebug check --continue
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: '**/build/reports/'
          retention-days: 7

  ios-compile:
    name: iOS compile check (shared code)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Compile all modules for iOS simulator
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 :core:model:iosSimulatorArm64Test --continue
