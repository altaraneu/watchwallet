name: Unsigned release build

# Builds the release variant from a tag twice, from two different paths, and fails if the results
# differ. The APK is unsigned: signing keys stay with the owner and this workflow uses no secrets.
# See docs/reproducible-builds.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Build, compare, publish checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: first
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: elsewhere/second
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # Caches stay off: both builds must compile everything themselves.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Build from the first path
        working-directory: first
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache :app:assembleRelease
      - name: Build from the second path
        working-directory: elsewhere/second
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache :app:assembleRelease
      - name: Compare the two builds
        run: |
          python3 first/scripts/compare_apks.py \
            first/app/build/outputs/apk/release/app-release-unsigned.apk \
            elsewhere/second/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Write checksums
        run: |
          mkdir out
          cp first/app/build/outputs/apk/release/app-release-unsigned.apk out/
          cp first/app/build/outputs/mapping/release/mapping.txt out/
          python3 first/scripts/compare_apks.py --list out/app-release-unsigned.apk > out/apk-entries.sha256
          (cd out && sha256sum app-release-unsigned.apk mapping.txt apk-entries.sha256 > SHA256SUMS)
          cat out/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release
          path: out/
          if-no-files-found: error
          retention-days: 90
